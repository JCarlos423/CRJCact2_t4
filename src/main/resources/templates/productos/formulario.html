<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 300px; padding: 8px; }
    </style>
</head>
<body>
    <h2>Registrar Producto</h2>
    <form th:action="@{/productos/guardar}" th:object="${productoDTO}" method="post">
        <div class="form-group">
            <label for="nombre">Nombre del Producto:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required />
        </div>
        <div class="form-group">
            <label for="precio">Precio:</label>
            <input type="number" step="0.01" id="precio" th:field="*{precio}" required />
        </div>
        <div class="form-group">
            <label for="categoria">Categoría:</label>
            <input type="text" id="categoria" th:field="*{categoria}" required />
        </div>
        <button type="submit">Guardar Producto</button>
    </form>
    <br>
    <a href="/productos">Volver a la lista</a>
</body>
</html>
